name: test terabox proxy
on: [workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run test
        run: node test.js
        env:
          NDUS: ${{ secrets.NDUS }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json
